name: toggl

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  toggl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE: ghcr.io/avinsonmassif/mcp-gateway-toggl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pinned versions
        id: versions
        run: |
          toggl=$(sed -n 's/^ARG TOGGL_MCP_VERSION=//p' toggl/Dockerfile)
          sg=$(sed -n 's/^ARG SUPERGATEWAY_VERSION=//p' toggl/Dockerfile)
          test -n "$toggl" && test -n "$sg"
          echo "tag=${toggl}-sg${sg}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.tag }},enable={{is_default_branch}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=mcp-gateway-toggl
            org.opencontainers.image.description=Toggl MCP server (@togglhq/mcp) over Streamable HTTP via supergateway

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: toggl
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=toggl
          cache-to: type=gha,scope=toggl,mode=max
